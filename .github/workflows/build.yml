name: Windows build and offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Offline tests
        shell: powershell
        run: ./test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AzerothCoopBrowser-windows-x64
          path: dist/AzerothCoopBrowser.exe
